# 单一共享开发数据库；服务名 mysql 供 Docker Compose 内部使用。
services:
  mysql:
    # MySQL 8.4 是当前项目 Prisma 的 MySQL 数据库运行环境。
    image: mysql:8.4
    # 容器固定名称，服务器排查日志时使用：docker logs pixel-town-mysql。
    container_name: pixel-town-mysql
    # 服务器重启后自动恢复容器，除非由人工明确停止。
    restart: unless-stopped
    # 真实密码仅从同目录、未提交 Git 的 .env 读取。
    env_file:
      - .env
    # 这些变量仅在首次创建空数据卷时创建数据库和开发账号。
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # 统一中文字符集、排序规则，并避免 MySQL 反向 DNS 查询。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    # 只监听服务器本机；禁止把 MySQL 3306 直接暴露到公网。
    ports:
      - "127.0.0.1:3306:3306"
    # 命名 Docker 卷持久化数据库数据；删容器不会删数据卷。
    volumes:
      - pixel_town_mysql_data:/var/lib/mysql
    # Compose 根据该检查显示 healthy；不通过时先查看容器日志。
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

# 此命名卷实际保存在服务器 Docker 数据目录，不提交 Git。
volumes:
  pixel_town_mysql_data:
